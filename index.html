<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字テスト（小学1〜4年）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漢字テスト">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EA;--paper:#FDFDF9;--ink:#1F2B29;--sub:#5A6A66;--line:#D0D9D3;--board:#2B5648;--board-ink:#F3F6F0;--chalk:#F2D36B;--wood:#B98B5E;--pen:#D8352C;
  --f-kyo:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#131C19;--paper:#1B2925;--ink:#E9EFE9;--sub:#9CAEA7;--line:#2E423A;--wood:#8C6A48;--pen:#FF7466;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.7}
.board{background:var(--board);color:var(--board-ink);border-bottom:6px solid var(--wood)}
.board div{max-width:640px;margin:0 auto;padding:18px 16px 14px}
h1{font-family:var(--f-kyo);font-weight:600;font-size:1.7rem;margin:0;letter-spacing:.04em}
.board p{margin:2px 0 0;color:var(--chalk);font-family:var(--f-kyo)}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:14px}
a.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;text-decoration:none;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px}
a.card:focus-visible{outline:3px solid #1E6FD9;outline-offset:2px}
a.card b{grid-row:span 2;font-family:var(--f-kyo);font-weight:600;font-size:2.6rem;line-height:1;color:var(--pen);border:2px solid var(--pen);border-radius:6px;width:1.4em;height:1.4em;display:grid;place-items:center}
a.card strong{font-size:1.15rem}
a.card span{color:var(--sub);font-size:.9rem}
.note{color:var(--sub);font-size:.85rem;margin:8px 0 0}
</style>
</head>
<body>
<header class="board"><div><h1>漢字テスト</h1><p>小学1〜4年</p></div></header>
<main>
  <a class="card" href="yomi.html"><b>読</b><strong>よみテスト</strong><span>文の中の漢字を読む。声・キーボード・自分で丸つけ</span></a>
  <a class="card" href="kakitori.html"><b>書</b><strong>かきとりテスト</strong><span>画面に指やペンで書く（書き順も判定）か、紙に書いて写真で採点（Gemini）</span></a>
  <p class="note">きろくは、使っている端末のブラウザに保存されます。ブラウザの閲覧データを消すと きろくも消えます。</p>
</main>
</body>
</html>
