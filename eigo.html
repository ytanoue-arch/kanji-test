<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語 発音テスト</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発音テスト">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 黒板の見出し＋英語ノート。漢字テストと同じ色でそろえ、英語は本の書体で大きく見せる */
:root{
  --bg:#EDF1EA; --paper:#FDFDF9; --ink:#1F2B29; --sub:#5A6A66; --rule:#B9CDC3; --line:#D0D9D3;
  --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#B98B5E;
  --pen:#D8352C; --pen-soft:#F6D9D5; --soft:#E3EAE4; --focus:#1E6FD9; --ok:#2B7A4B; --ok-soft:#DCEFE3;
  --f-en:"Literata","Georgia","Times New Roman",serif;
  --f-ipa:"Noto Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131C19; --paper:#1B2925; --ink:#E9EFE9; --sub:#9CAEA7; --rule:#36524A; --line:#2E423A;
    --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#8C6A48;
    --pen:#FF7466; --pen-soft:#4A2A27; --soft:#22332D; --focus:#8AB8FF; --ok:#7FD39C; --ok-soft:#1F3A2B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131C19; --paper:#1B2925; --ink:#E9EFE9; --sub:#9CAEA7; --rule:#36524A; --line:#2E423A;
  --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#8C6A48;
  --pen:#FF7466; --pen-soft:#4A2A27; --soft:#22332D; --focus:#8AB8FF; --ok:#7FD39C; --ok-soft:#1F3A2B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:inherit}

.board{background:var(--board);color:var(--board-ink);border-bottom:6px solid var(--wood)}
.board-in{max-width:760px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.board h1{font-weight:700;font-size:1.35rem;line-height:1.2;margin:0;letter-spacing:.04em}
.board .range{font-family:var(--f-en);color:var(--chalk);font-size:1rem;margin-right:auto;font-style:italic}
.nav{display:flex;gap:6px}
.nav button{background:transparent;border:1.5px solid transparent;color:var(--board-ink);border-radius:999px;padding:4px 16px;font-weight:700}
.nav button[aria-current="page"]{border-color:var(--chalk);color:var(--chalk)}
.home-link{color:var(--board-ink);opacity:.8;font-size:.85rem}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h2{font-size:1.2rem;margin:0 0 14px;font-weight:700;text-wrap:balance}
h3{font-size:1rem;margin:28px 0 10px;font-weight:700}
.note{color:var(--sub);font-size:.875rem;margin:6px 0 0}
.row{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.row .lab{font-weight:700;padding-top:6px}
.row .note{grid-column:2}
@media (max-width:520px){.row{grid-template-columns:1fr}.row .lab{padding-top:0}.row .note{grid-column:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;min-height:40px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--board-ink);font-weight:700}
.chip.add{border-style:dashed;color:var(--sub)}
.addbox{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
input[type=text],input[type=password]{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;min-width:0;flex:1 1 12em}
details.more{border-top:1px solid var(--line);padding:10px 0 0}
details.more summary{font-weight:700;cursor:pointer;padding:4px 0 8px}
.pool{margin:16px 0 10px;font-weight:700}
.btn{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 18px;min-height:48px;font-weight:700}
.btn.primary{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.btn.pen{background:transparent;border-color:var(--pen);color:var(--pen)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub);text-decoration:underline;font-weight:500}
.btn.big{width:100%;font-size:1.15rem;min-height:60px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.flash{background:var(--soft);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.flash.err{background:var(--pen-soft)}
.gkey label{display:block;font-weight:700;margin-bottom:4px}

/* ---------- テスト ---------- */
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--board);border-radius:99px;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--board);border-radius:8px;padding:16px 18px 18px;position:relative}
.tags{display:flex;gap:6px;font-size:.78rem;color:var(--sub);font-weight:700;flex-wrap:wrap}
.tags span{border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg)}
.word{font-family:var(--f-en);font-weight:700;font-size:clamp(40px,12vw,64px);line-height:1.15;margin:18px 0 6px;letter-spacing:.01em;overflow-wrap:anywhere}
.sent{font-family:var(--f-en);font-weight:500;font-size:clamp(21px,5.6vw,28px);line-height:1.55;margin:14px 0 4px}
.sent .tg{font-weight:700;border-bottom:3px solid var(--pen)}
.sent .w{border-radius:4px;padding:0 1px}
.sent .w.miss{background:var(--pen-soft);text-decoration:underline wavy var(--pen) 2px;text-underline-offset:4px}
.ipa{font-family:var(--f-ipa);font-size:1.15rem;color:var(--sub);margin:0;letter-spacing:.02em}
.ipa b{color:var(--ink);font-weight:600}
.listen{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.listen .btn{min-height:42px;padding:6px 14px}

.recwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 6px}
.mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--board);color:var(--board-ink);display:grid;place-items:center;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mic svg{width:44px;height:44px}
.mic.rec{background:var(--pen)}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--pen);opacity:.5;transform:scale(var(--lv,1));transition:transform .08s}
.mic:disabled{opacity:.5}
.mic-label{font-weight:700}
.mic-sub{color:var(--sub);font-size:.85rem;margin-top:-6px;text-align:center}
@media (prefers-reduced-motion:reduce){.mic.rec::after{transition:none}.prog i{transition:none}}

.verdict{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
.verdict .mk{font-family:var(--f-en);font-weight:700;font-size:2.4rem;line-height:1;color:var(--pen)}
.verdict .mk.ok{color:var(--ok)}
.verdict b{font-size:1.3rem}
.verdict .sc{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:700}
.heard{margin:2px 0 0;color:var(--sub)}
.heard q{font-family:var(--f-en);color:var(--ink);font-size:1.1rem;quotes:"“" "”"}
.issues{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.issues li{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:6px;padding:8px 12px}
.issues .part{font-family:var(--f-ipa);font-weight:600;margin-right:6px}
.issues .tip{display:block;color:var(--sub);font-size:.92rem;margin-top:2px}
.comment{margin:10px 0 0;background:var(--ok-soft);border-radius:8px;padding:8px 12px}
.panel .btns{margin-top:14px}
.tfoot{margin-top:18px;display:flex;justify-content:flex-end}

/* 結果・きろく */
.paperhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.score{font-family:var(--f-en);font-weight:700;color:var(--pen);font-size:4.2rem;line-height:1;border-bottom:7px double var(--pen);padding:0 .1em .04em;transform:rotate(-3deg);transform-origin:left bottom}
.score small{font-family:var(--f-ui);font-size:1.3rem;margin-left:.1em}
.facts{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-variant-numeric:tabular-nums}
.facts dt{color:var(--sub)}
.facts dd{margin:0;font-weight:700}
.cmp{margin:12px 0 0;font-weight:700}
.cmp .up{color:var(--ok)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.list .m{font-family:var(--f-en);font-weight:700;font-size:1.4rem;color:var(--ok);text-align:center;line-height:1}
.list .m.ng{color:var(--pen)}
.list .en{font-family:var(--f-en);font-weight:600;font-size:1.15rem;min-width:0;overflow-wrap:anywhere}
.list .sub{grid-column:2 / 4;color:var(--sub);font-size:.85rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list .sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline;font-size:.85rem}
.sum{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.sum div{padding:12px 14px;border-left:1px solid var(--line)}
.sum div:first-child{border-left:0}
.sum b{display:block;font-size:1.5rem;line-height:1.3;font-variant-numeric:tabular-nums}
.sum span{color:var(--sub);font-size:.85rem}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,1fr)}.sum div:nth-child(3){border-left:0}.sum div:nth-child(n+3){border-top:1px solid var(--line)}}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:9em minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:.92rem}
.bar .tr{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--board);border-radius:99px}
.bar span:last-child{font-variant-numeric:tabular-nums;text-align:right;color:var(--sub)}
@media (max-width:520px){.bar{grid-template-columns:7em minmax(0,1fr) 4.8em}}
details.hist{border-bottom:1px solid var(--line)}
details.hist summary::before{content:'＋';color:var(--sub)}
details.hist[open] summary::before{content:'－'}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary{list-style:none;display:flex;gap:12px;flex-wrap:wrap;padding:10px 2px;cursor:pointer;font-variant-numeric:tabular-nums}
details.hist summary .pt{font-family:var(--f-en);font-weight:700;color:var(--pen);font-size:1.25rem;line-height:1.3;min-width:3.4em}
details.hist summary .dt{color:var(--sub)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--sub)}

.kcheck{margin-top:10px}
.kcheck-out .flash{margin:10px 0 0}
.kcheck-raw{display:block;font-size:.8rem;color:var(--sub);margin-top:4px;word-break:break-all}
</style>
</head>
<body>
<header class="board">
  <div class="board-in">
    <h1>英語 発音テスト</h1>
    <span class="range">Pronunciation</span>
    <nav class="nav" id="nav" aria-label="画面の切りかえ">
      <button type="button" data-go="home" aria-current="page">テスト</button>
      <button type="button" data-go="records">きろく</button>
    </nav>
  </div>
</header>

<main>
  <section id="v-home">
    <h2>テストの じゅんび</h2>
    <p class="flash" id="flash" hidden></p>
    <div class="row"><div class="lab">だれが やる？</div><div>
      <div class="chips" id="c-player"></div>
      <div class="addbox" id="addbox" hidden>
        <input type="text" id="in-name" maxlength="12" placeholder="なまえ（ニックネーム）" aria-label="なまえ">
        <button type="button" class="btn" id="b-addname">この名前で追加</button>
      </div>
    </div></div>
    <div class="row"><div class="lab">読むもの</div><div class="chips" id="c-mode"></div>
      <p class="note" id="mode-note"></p></div>
    <div class="row"><div class="lab">練習したい音</div><div class="chips" id="c-tags"></div>
      <p class="note">日本語を話す人がまちがえやすい点で分けています。えらんだどれかに当てはまる単語が出ます。</p></div>
    <div class="row"><div class="lab">問題の数</div><div class="chips" id="c-n"></div></div>
    <div class="row"><div class="lab">判定</div><div><div class="chips" id="c-judge"></div><div id="gk"></div></div>
      <p class="note" id="judge-note"></p></div>
    <details class="more">
      <summary>くわしい設定</summary>
      <div class="row"><div class="lab">出し方</div><div class="chips" id="c-how"></div>
        <p class="note">「おまかせ」は、まだ出ていない単語と まちがえた単語を多めに出します。</p></div>
      <div class="row"><div class="lab">発音記号</div><div class="chips" id="c-ipa"></div></div>
      <div class="row"><div class="lab">お手本</div><div class="chips" id="c-pre"></div>
        <p class="note">お手本はブラウザの英語の声（アメリカ英語）で読み上げます。</p></div>
    </details>
    <p class="pool" id="pool"></p>
    <button type="button" class="btn primary big" id="b-start">テストを はじめる</button>
    <p class="note" style="margin-top:20px"><a href="./">← 漢字テストのページへ</a></p>
  </section>

  <section id="v-test" hidden>
    <div class="tbar"><span id="t-count"></span><div class="prog" aria-hidden="true"><i id="t-prog"></i></div></div>
    <div class="card">
      <div class="tags" id="t-tags"></div>
      <div id="t-text"></div>
      <p class="ipa" id="t-ipa" hidden></p>
      <div class="listen" id="t-listen"></div>
    </div>
    <div class="recwrap" id="t-rec">
      <button type="button" class="mic" id="b-mic" aria-label="おして話す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
      </button>
      <div class="mic-label" id="mic-label">おして話す</div>
      <div class="mic-sub" id="mic-sub">話し終わると自動でとまります</div>
    </div>
    <div class="panel" id="t-panel" aria-live="polite"></div>
    <div class="tfoot"><button type="button" class="btn ghost" id="b-quit">テストを やめる</button></div>
  </section>

  <section id="v-result" hidden></section>
  <section id="v-records" hidden></section>
</main>

<script type="text/plain" id="words">

    var hit=alts.some(function(a){var t=toks(a);return t.indexOf(target)>=0||t.indexOf(target+'s')>=0;});
    var best=alts[0];
    return {heard:best,ok:hit,score:hit?(toks(alts[0]).indexOf(target)>=0?90:75):20,issues:[],comment:hit?'その単語として聞き取れました。':'「'+w.w+'」として聞き取れませんでした。お手本を聞いて、もう一度ためしてみよう。'};
  }
  var bestOk=null,bestN=-1,bestA='';
  alts.forEach(function(a){var ok=lcsMark(w.s,a),c=ok.filter(Boolean).length;if(c>bestN){bestN=c;bestOk=ok;bestA=a;}});
  var words=toks(w.s),ratio=bestN/words.length,ti=words.indexOf(target),tiOk=ti<0||bestOk[ti];
  words.forEach(function(x,i){if(!bestOk[i]&&x.indexOf(target)===0&&x.length<=target.length+3)tiOk=false;});
  return {heard:bestA,ok:ratio>=0.9&&tiOk,score:Math.round(ratio*100),words:words.map(function(x,i){return {word:x,ok:bestOk[i]};}),issues:[],
    comment:ratio>=0.9&&tiOk?'文全体が聞き取れました。':'赤い印の単語が聞き取れませんでした。'};
}

/* ================= テスト ================= */
var T={};
var MIC_SVG=$('#b-mic').innerHTML;
var STOP_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function startTest(ws,mode,kind){
  T={ws:ws,i:0,res:[],mode:mode,kind:kind||'',j:judgeKind(),player:P(),state:'idle',srObj:null};
  show('test');
  if(T.j==='g'){
    setMic('wait','マイクを じゅんび しています…','');
    micOpen().then(function(ok){
      if(view!=='test')return;
      if(ok===false){T.state='mic';showMicError('マイクを使う許可がありませんでした。ブラウザでこのページのマイクを「許可」にしてから、もう一度はじめてください。');return;}
      if(ok===null){T.state='mic';showMicError('このブラウザでは録音ができませんでした。SafariかChromeで開いてください。');return;}
      next();
    });
  }else next();
}
function showMicError(msg){
  var p=$('#t-panel');p.textContent='';var e=el('p','flash err',msg);e.setAttribute('role','alert');p.appendChild(e);
  p.appendChild(btn('じゅんびにもどる','',function(){endTest(true);}));
  setMic('off','','');
}
function setMic(state,label,sub){
  var m=$('#b-mic');m.disabled=(state==='wait'||state==='busy'||state==='off');
  m.classList.toggle('rec',state==='rec');m.innerHTML=state==='rec'?STOP_SVG:MIC_SVG;
  m.setAttribute('aria-label',state==='rec'?'録音をとめる':'おして話す');
  $('#mic-label').textContent=label;$('#mic-sub').textContent=sub;
  $('#t-rec').hidden=(state==='hide');
}
function renderCard(w,answered){
  var host=$('#t-text');host.textContent='';
  var tags=$('#t-tags');tags.textContent='';w.tags.forEach(function(t){tags.appendChild(el('span',null,TAGS[t]));});
  if(T.mode==='word'){
    host.appendChild(el('p','word',w.w));
  }else{
    var p=el('p','sent');p.lang='en';
    var res=answered&&answered.words;
    if(res){
      var parts=w.s.split(/(\s+)/),k=0,tg=findTarget(w),pos=0;
      parts.forEach(function(part){
        if(/^\s+$/.test(part)||!part){p.appendChild(document.createTextNode(part));pos+=part.length;return;}
        var sp=el('span','w',part),pn=toks(part),bad=false;
        pn.forEach(function(tk){
          for(var j=k;j<Math.min(res.length,k+4);j++){if(norm(res[j].word)===tk||toks(res[j].word).indexOf(tk)>=0){if(res[j].ok===false)bad=true;k=j+1;break;}}
        });
        if(bad)sp.classList.add('miss');
        if(tg&&pos<=tg.i&&tg.i<pos+part.length)sp.classList.add('tg');
        p.appendChild(sp);pos+=part.length;
      });
    }else{
      var t=findTarget(w);
      if(t){p.appendChild(document.createTextNode(w.s.slice(0,t.i)));p.appendChild(el('span','tg',w.s.slice(t.i,t.i+t.len)));p.appendChild(document.createTextNode(w.s.slice(t.i+t.len)));}
      else p.textContent=w.s;
    }
    host.appendChild(p);
  }
  var ipa=$('#t-ipa');ipa.textContent='';
  if(S.ipa==='before'||(S.ipa==='after'&&answered)){ipa.hidden=false;ipa.appendChild(el('b',null,w.w));ipa.appendChild(document.createTextNode('  /'+w.ipa+'/'));}else ipa.hidden=true;
  var ls=$('#t-listen');ls.textContent='';
  if(answered||S.pre){
    var text=T.mode==='word'?w.w:w.s;
    ls.appendChild(btn('▶ お手本','',function(){speak(text,false);}));
    ls.appendChild(btn('▶ ゆっくり','',function(){speak(text,true);}));
    if(answered&&answered.wav){ls.appendChild(btn('▶ 自分の声','',function(){try{var a=new Audio(answered.wav);a.play();}catch(e){}}));}
  }
}
function next(){
  clearTimeout(T.auto);
  if(T.i>=T.ws.length)return endTest();
  var w=T.w=T.ws[T.i];T.try=0;T.first=null;
  $('#t-count').textContent=(T.i+1)+' / '+T.ws.length;
  $('#t-prog').style.width=(T.i/T.ws.length*100)+'%';
  $('#t-panel').textContent='';
  renderCard(w,null);
  T.state='ready';
  setMic('ready','おして話す',T.mode==='word'?'単語を1回はっきり言おう。話し終わると自動でとまります':'英文をさいごまで読もう。話し終わると自動でとまります');
}
$('#b-mic').addEventListener('click',function(){
  if(T.state==='rec'){if(T.j==='g')recStop('tap');else if(T.srObj){try{T.srObj.stop();}catch(e){}}return;}
  if(T.state!=='ready'&&T.state!=='done')return;
  clearTimeout(T.auto);
  try{window.speechSynthesis.cancel();}catch(e){}
  T.state='rec';$('#t-panel').textContent='';
  setMic('rec','聞いています…','話し終わったら少し待つか、■をおしてとめます');
  if(T.j==='g'){
    recStart(T.mode==='word'?6000:16000,T.mode==='word'?1000:1400,function(why,heard){
      if(!heard){T.state='ready';setMic('ready','おして話す','声が聞こえませんでした。マイクに近づいて、もう一度おして話してください');return;}
      var wav=takeWav();judgeG(wav);
    });
  }else{
    T.srObj=browserListen(T.w,T.mode,function(r){
      T.srObj=null;
      if(r.error){T.state='ready';setMic('ready','おして話す','');var p=$('#t-panel');p.textContent='';p.appendChild(el('p','flash err',r.error));return;}
      showResult(judgeBrowser(T.w,T.mode,r.alts),null);
    });
  }
});
function judgeG(wav){
  T.state='busy';setMic('busy','判定しています…','数秒かかります');
  var w=T.w,url=URL.createObjectURL(wav.blob);
  callGemini(T.mode==='word'?promptWord(w):promptSent(w),b64(wav.buf),T.mode==='word'?SCHEMA_WORD:SCHEMA_SENT).then(function(r){
    if(T.w!==w||view!=='test')return;
    r=r||{};
    var out={heard:String(r.heard||''),ok:!!r.ok,score:Math.max(0,Math.min(100,parseInt(r.score,10)||0)),stress_ok:r.stress_ok,
      issues:Array.isArray(r.issues)?r.issues.slice(0,3):[],comment:String(r.comment||''),words:Array.isArray(r.words)?r.words:null};
    if(out.score<60)out.ok=false;
    showResult(out,url);
  },function(e){
    if(T.w!==w||view!=='test')return;
    T.state='ready';setMic('ready','もう一度 おして話す','');
    var p=$('#t-panel');p.textContent='';var er=el('p','flash err',e.message);er.setAttribute('role','alert');p.appendChild(er);
    p.appendChild(btn('この問題をとばす','',function(){T.res.push({id:T.w.id,ok:0,score:null,skip:1});T.i++;next();}));
  });
}
function showResult(r,wavUrl){
  r.wav=wavUrl;T.try++;
  if(!T.first){T.first=r;T.res.push({id:T.w.id,ok:r.ok?1:0,score:r.score});}
  T.state='done';
  renderCard(T.w,r);
  setMic('ready','もう一度 話してみる','練習用です。点数は1回めの結果で記録します');
  var p=$('#t-panel');p.textContent='';
  var v=el('div','verdict');
  v.appendChild(el('span','mk'+(r.ok?' ok':''),r.ok?'○':'×'));
  v.appendChild(el('b',null,r.ok?(T.try>1?'できました！':'よく言えました'):'もう少し'));
  if(typeof r.score==='number')v.appendChild(el('span','sc',r.score+'点'));
  if(T.try>1)v.appendChild(el('span','sc','（'+T.try+'回め・練習）'));
  p.appendChild(v);
  var h=el('p','heard');h.appendChild(document.createTextNode('聞こえた英語：'));h.appendChild(el('q',null,r.heard||'（聞き取れませんでした）'));p.appendChild(h);
  if(r.stress_ok===false&&T.mode==='word')p.appendChild(el('p','note','アクセント（強く読む場所）がずれています。'));
  if(r.issues&&r.issues.length){
    var ul=el('ul','issues');
    r.issues.forEach(function(it){var li=el('li');li.appendChild(el('span','part',String(it.part||'')));li.appendChild(document.createTextNode(String(it.problem||'')));if(it.tip)li.appendChild(el('span','tip',String(it.tip)));ul.appendChild(li);});
    p.appendChild(ul);
  }
  if(r.comment)p.appendChild(el('p','comment',r.comment));
  var b=el('div','btns');
  var last=T.i===T.ws.length-1;
  var nx=btn(last?'結果を見る':'つぎへ','primary',function(){T.i++;next();});b.appendChild(nx);
  if(T.first&&!T.first.ok&&r===T.first)b.appendChild(btn('いまのは あっていた','pen',function(){var x=T.res[T.res.length-1];x.ok=1;x.fixed=1;T.i++;next();}));
  p.appendChild(b);
  if(r.ok&&T.try===1)T.auto=setTimeout(function(){if(T.state==='done'&&T.first===r)nx.click();},2600);
}
['click','touchstart'].forEach(function(evn){$('#t-panel').addEventListener(evn,function(){clearTimeout(T.auto);},{passive:true});$('#t-listen').addEventListener(evn,function(){clearTimeout(T.auto);},{passive:true});});
function endTest(abort){
  clearTimeout(T.auto);if(T.srObj){try{T.srObj.abort();}catch(e){}}
  Rec.on=false;micClose();try{window.speechSynthesis.cancel();}catch(e){}
  var res=(T.res||[]).filter(function(r){return !r.skip;});
  T.state='idle';
  if(abort===true||!res.length){renderHome();show('home');return;}
  T.sess={t:Date.now(),m:T.mode,j:T.j,k:T.kind,it:res.map(function(r){var a=[r.id,r.ok,r.score];if(r.fixed)a.push(1);return a;})};
  var p=T.player;if(Store.players.indexOf(p)<0)Store.players.push(p);p.auto=false;p.s.push(T.sess);persist();
  renderResult();show('result');
}
$('#b-quit').addEventListener('click',function(){endTest();});

/* ================= 結果 ================= */
function summarize(items){var n=items.length,ok=0,sc=0,sn=0;items.forEach(function(it){if(it[1])ok++;if(typeof it[2]==='number'){sc+=it[2];sn++;}});return {n:n,ok:ok,avg:sn?Math.round(sc/sn):null};}
function scoreOf(s){var m=summarize(s.it);return pct(m.ok,m.n);}
function itemRow(it,mode,onFlip){
  var w=BYID[it[0]],li=el('li');
  li.appendChild(el('span','m'+(it[1]?'':' ng'),it[1]?'○':'×'));
  var en=el('span','en',w?(mode==='sent'?w.s:w.w):it[0]);en.lang='en';li.appendChild(en);
  li.appendChild(el('span','sc',typeof it[2]==='number'?it[2]+'点':''));
  var sub=el('div','sub');
  if(w){sub.appendChild(el('span',null,'/'+w.ipa+'/'));var pl=btn('▶','',function(){speak(mode==='sent'?w.s:w.w,false);});pl.className='link';pl.setAttribute('aria-label','お手本を聞く');sub.appendChild(pl);}
  if(it[3])sub.appendChild(el('span',null,'直した'));
  if(onFlip){var b=el('button','link',it[1]?'×に直す':'○に直す');b.type='button';b.addEventListener('click',onFlip);sub.appendChild(b);}
  li.appendChild(sub);return li;
}
function flip(p,sess,i){var it=sess.it[i];it[1]=it[1]?0:1;if(it[1])it[3]=1;else it.length=Math.min(it.length,3);persist();}
function renderResult(){
  var host=$('#v-result');host.textContent='';
  var sess=T.sess,sm=summarize(sess.it),now=pct(sm.ok,sm.n);
  host.appendChild(el('h2',null,T.player.name+' さんの けっか（'+MODE[sess.m]+'）'));
  var head=el('div','paperhead');var sc=el('div','score',String(now));sc.appendChild(el('small',null,'点'));head.appendChild(sc);
  var dl=el('dl','facts');
  [['正解',sm.ok+' / '+sm.n+'問'],['発音の平均点',sm.avg==null?'—':sm.avg+'点'],['判定',sess.j==='g'?'Gemini':'ブラウザの音声認識']].forEach(function(r){dl.appendChild(el('dt',null,r[0]));dl.appendChild(el('dd',null,r[1]));});
  head.appendChild(dl);host.appendChild(head);
  var ss=T.player.s.filter(function(x){return x.m===sess.m;});
  if(ss.length>1){var prev=scoreOf(ss[ss.length-2]),d=now-prev;var cmp=el('p','cmp','ぜんかい '+prev+'点 → こんかい '+now+'点');if(d)cmp.appendChild(el('span',d>0?'up':'',' （'+(d>0?'+':'')+d+'点）'));host.appendChild(cmp);}
  host.appendChild(el('p','note','この結果は「きろく」に保存しました。判定がちがっていたら「○に直す／×に直す」で直せます。'));
  host.appendChild(el('h3',null,'1問ずつの結果'));
  var ul=el('ul','list');sess.it.forEach(function(it,i){ul.appendChild(itemRow(it,sess.m,function(){flip(T.player,sess,i);renderResult();}));});host.appendChild(ul);
  var b=el('div','btns');b.style.marginTop='20px';
  var wrong=sess.it.filter(function(it){return !it[1];}).map(function(it){return BYID[it[0]];}).filter(Boolean);
  if(wrong.length)b.appendChild(btn('まちがえた単語を もう一度','primary',function(){startTest(wrong,sess.m,'retry');}));
  b.appendChild(btn('べつの問題で もう一度',wrong.length?'':'primary',function(){var ws=pick();if(ws.length)startTest(ws,S.mode,'');}));
  b.appendChild(btn('きろくを見る','',function(){renderRecords();show('records');}));
  b.appendChild(btn('じゅんびにもどる','',function(){renderHome();show('home');}));
  host.appendChild(b);
}

/* ================= きろく ================= */
function fmtDate(t){var d=new Date(t);function z(n){return (n<10?'0':'')+n;}return (d.getMonth()+1)+'/'+d.getDate()+' '+z(d.getHours())+':'+z(d.getMinutes());}
var delArmed=false;
function renderRecords(){
  var host=$('#v-records');host.textContent='';var p=P(),st=stats(p);
  host.appendChild(el('h2',null,'きろく'));
  var chips=el('div','chips');chips.style.marginBottom='16px';
  Store.players.forEach(function(x){var b=el('button','chip',x.name);b.type='button';b.setAttribute('aria-pressed',x===p?'true':'false');b.addEventListener('click',function(){S.player=x.id;saveSettings();delArmed=false;renderRecords();});chips.appendChild(b);});
  host.appendChild(chips);
  var n=0,ok=0,sc=0,sn=0;Object.keys(st.q).forEach(function(id){var a=st.q[id];n+=a[0];ok+=a[1];sc+=a[2];sn+=a[3];});
  if(!n){host.appendChild(el('p','empty','まだ きろくが ありません。「テスト」で1回やってみると、ここに正解率・発音の点数・にがてな単語が出ます。'));return;}

  host.appendChild(sum);
  host.appendChild(el('h3',null,'音の種類ごとの正解率'));
  var bars=el('div','bars');
  TAG_ORDER.forEach(function(t){
    var tn=0,tok=0;WORDS.forEach(function(w){if(w.tags.indexOf(t)<0)return;var a=st.q[w.id];if(a){tn+=a[0];tok+=a[1];}});
    var r=el('div','bar');r.appendChild(el('span',null,TAGS[t]));var tr=el('span','tr'),i=el('i');i.style.width=(tn?pct(tok,tn):0)+'%';tr.appendChild(i);r.appendChild(tr);
    r.appendChild(el('span',null,tn?pct(tok,tn)+'%（'+tn+'問）':'—'));bars.appendChild(r);
  });
  host.appendChild(bars);
  var weak=WORDS.filter(function(w){return isWeak(st.q[w.id]);}).sort(function(a,b){var x=st.q[a.id],y=st.q[b.id];return (x[1]/x[0])-(y[1]/y[0])||y[0]-x[0];});
  host.appendChild(el('h3',null,'にがてな単語（'+weak.length+'語）'));
  if(!weak.length)host.appendChild(el('p','empty','いまは ありません。さいごにまちがえた単語や、正解率が80%より低い単語がここに出ます。'));
  else{
    var ul=el('ul','list');
    weak.slice(0,40).forEach(function(w){var a=st.q[w.id];ul.appendChild(itemRow([w.id,0,a[3]?Math.round(a[2]/a[3]):null],'word',null));ul.lastChild.querySelector('.m').textContent='×';ul.lastChild.querySelector('.sub').appendChild(el('span',null,a[1]+'/'+a[0]+'回'));});
    host.appendChild(ul);
    var wb=el('div','btns');wb.style.marginTop='12px';
    wb.appendChild(btn('にがてな単語だけ テストする','primary',function(){startTest(weak.slice().sort(function(){return Math.random()-0.5;}).slice(0,S.n),S.mode,'weak');}));
    host.appendChild(wb);
  }
  host.appendChild(el('h3',null,'点数の記録（'+p.s.length+'回）'));
  p.s.slice(-50).reverse().forEach(function(s){
    var m=summarize(s.it),d=el('details','hist'),smy=el('summary');
    smy.appendChild(el('span','pt',pct(m.ok,m.n)+'点'));smy.appendChild(el('span',null,m.ok+'/'+m.n+'問'));
    smy.appendChild(el('span',null,'発音 '+(m.avg==null?'—':m.avg+'点')));smy.appendChild(el('span','dt',fmtDate(s.t)));
    smy.appendChild(el('span','dt',MODE[s.m]+'・'+(s.j==='g'?'Gemini':'音声認識')+(s.k==='weak'?'・にがて':s.k==='retry'?'・やりなおし':'')));
    d.appendChild(smy);
    d.addEventListener('toggle',function(){if(!d.open||d.querySelector('ul'))return;var ul2=el('ul','list');s.it.forEach(function(it,i){ul2.appendChild(itemRow(it,s.m,function(){flip(p,s,i);renderRecords();}));});d.appendChild(ul2);});
    host.appendChild(d);
  });
  var tools=el('div','btns');tools.style.marginTop='24px';
  tools.appendChild(btn('CSVで書き出す','',function(){
    function c(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
    var rows=[['日時','名前','テストの点数','種類','判定','単語','発音記号','例文','正解','発音の点数']];
    p.s.forEach(function(s){var d=new Date(s.t),ds=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
      s.it.forEach(function(it){var w=BYID[it[0]];rows.push([ds,p.name,scoreOf(s),MODE[s.m],s.j==='g'?'Gemini':'音声認識',w?w.w:it[0],w?w.ipa:'',w?w.s:'',it[1]?1:0,typeof it[2]==='number'?it[2]:'']);});});
    var text='\uFEFF'+rows.map(function(r){return r.map(c).join(',');}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));var dd=new Date();a.download='eigo-hatsuon-'+dd.getFullYear()+('0'+(dd.getMonth()+1)).slice(-2)+('0'+dd.getDate()).slice(-2)+'.csv';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  }));
  if(!delArmed)tools.appendChild(btn(p.name+' さんの きろくを消す','ghost',function(){delArmed=true;renderRecords();}));
  else{tools.appendChild(btn('本当に消す（元にもどせません）','pen',function(){delArmed=false;Store.players=Store.players.filter(function(x){return x!==p;});if(!Store.players.length)Store.players=[newPlayer('じぶん',true)];S.player=null;P();saveSettings();persist();renderRecords();}));tools.appendChild(btn('やめる','',function(){delArmed=false;renderRecords();}));}
  host.appendChild(tools);
  host.appendChild(el('p','note','きろくは このブラウザに保存されています。ブラウザの閲覧データを消すと きろくも消えます。'));
}
