<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字よみテスト（小学1〜4年）</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EA; --paper:#FDFDF9; --ink:#1F2B29; --sub:#5A6A66; --rule:#CFDDD6; --line:#D0D9D3;
  --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#B98B5E;
  --pen:#D8352C; --soft:#E3EAE4; --focus:#1E6FD9;
  --f-kyo:"Klee One","UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","YuKyokasho","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131C19; --paper:#1B2925; --ink:#E9EFE9; --sub:#9CAEA7; --rule:#2B4038; --line:#2E423A;
    --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#8C6A48;
    --pen:#FF7466; --soft:#22332D; --focus:#8AB8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#131C19; --paper:#1B2925; --ink:#E9EFE9; --sub:#9CAEA7; --rule:#2B4038; --line:#2E423A;
  --board:#2B5648; --board-ink:#F3F6F0; --chalk:#F2D36B; --wood:#8C6A48;
  --pen:#FF7466; --soft:#22332D; --focus:#8AB8FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}

/* 黒板のヘッダー */
.board{background:var(--board);color:var(--board-ink);border-bottom:6px solid var(--wood)}
.board-in{max-width:760px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.board h1{font-family:var(--f-kyo);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0;letter-spacing:.04em}
.board .range{font-family:var(--f-kyo);color:var(--chalk);font-size:.95rem;margin-right:auto}
.nav{display:flex;gap:6px}
.nav button{background:transparent;border:1.5px solid transparent;color:var(--board-ink);border-radius:999px;padding:4px 16px;font-weight:700}
.nav button[aria-current="page"]{border-color:var(--chalk);color:var(--chalk)}

main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:1.2rem;margin:0 0 14px;font-weight:700}
h3{font-size:1rem;margin:28px 0 10px;font-weight:700}
.note{color:var(--sub);font-size:.875rem;margin:6px 0 0}

/* 設定の行 */
.row{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.row .lab{font-weight:700;padding-top:6px}
.row .note{grid-column:2}
@media (max-width:520px){.row{grid-template-columns:1fr}.row .lab{padding-top:0}.row .note{grid-column:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;min-height:40px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--board-ink);font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip.add{border-style:dashed;color:var(--sub)}
.addbox{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
input[type=text]{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;min-width:0;flex:1 1 12em}
details.more{border-top:1px solid var(--line);padding:10px 0 0}
details.more summary{font-weight:700;cursor:pointer;padding:4px 0 8px}
.pool{margin:16px 0 10px;font-weight:700}

.btn{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 18px;min-height:48px;font-weight:700}
.btn.primary{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.btn.pen{background:transparent;border-color:var(--pen);color:var(--pen)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub);text-decoration:underline;font-weight:500}
.btn.big{width:100%;font-size:1.15rem;min-height:60px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* テスト画面 */
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--board);border-radius:99px;transition:width .3s}
#t-clock{min-width:5.5em;text-align:right}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:44px 20px 28px;display:flex;justify-content:center;min-height:300px}
.tags{position:absolute;top:10px;left:14px;display:flex;gap:6px;font-size:.8rem;color:var(--sub);font-weight:700}
.tags span{border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg)}
.q-sent{--col:2.3em;margin:0;writing-mode:vertical-rl;font-family:var(--f-kyo);font-weight:600;font-size:clamp(30px,8.4vw,44px);line-height:var(--col);height:9.6em;letter-spacing:.06em;
  background-image:repeating-linear-gradient(to left,transparent 0,transparent calc(var(--col) - 1px),var(--rule) calc(var(--col) - 1px),var(--rule) var(--col));
  border-right:1px solid var(--rule);transition:opacity .15s}
.sheet.is-prep .q-sent{opacity:0}
.q-sent span.tg{display:inline-block;border-right:.11em solid var(--pen);padding-right:.16em}
.q-sent rt{font-size:.46em;color:var(--pen);font-weight:600;letter-spacing:0}
.mark{position:absolute;left:5%;top:0;bottom:0;margin:auto 0;width:min(34%,170px);height:auto;pointer-events:none;fill:none;stroke:var(--pen);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.mark path{stroke-dasharray:640;stroke-dashoffset:640;animation:draw .5s ease-out forwards}
.mark path:nth-child(2){animation-delay:.18s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mark path{animation:none;stroke-dashoffset:0}.prog i{transition:none}.q-sent{transition:none}}

.panel{margin-top:14px;min-height:150px}
.say{font-size:1.1rem;font-weight:700;margin:0}
.say small{display:block;font-weight:500;color:var(--sub);font-size:.9rem}
.mic{display:flex;align-items:center;gap:12px}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--line)}
.mic.on .dot{background:var(--pen);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}
.heard{margin:10px 0 0;min-height:1.7em;color:var(--sub)}
.heard b{color:var(--ink);font-family:var(--f-kyo);font-size:1.15rem}
.verdict{font-family:var(--f-kyo);font-weight:600;font-size:1.5rem;margin:0;line-height:1.4}
.verdict.ok{color:var(--pen)}
.verdict b{font-size:1.9rem}
.panel .btns{margin-top:14px}
.tfoot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tfoot #b-quit{margin-left:auto}
.cd{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--soft);border-radius:0 0 8px 8px;overflow:hidden}
.cd i{display:block;height:100%;width:100%;background:var(--board)}
.cd.low i{background:var(--pen)}
.paused{position:absolute;inset:0;margin:auto;height:2em;text-align:center;font-weight:700;color:var(--sub);font-size:1.2rem}

/* 結果 */
.paperhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.score{font-family:var(--f-kyo);font-weight:600;color:var(--pen);font-size:4.4rem;line-height:1;border-bottom:7px double var(--pen);padding:0 .12em .04em;transform:rotate(-4deg);transform-origin:left bottom}
.score small{font-size:1.4rem;margin-left:.1em}
.facts{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-variant-numeric:tabular-nums}
.facts dt{color:var(--sub)}
.facts dd{margin:0;font-weight:700}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:2em 1fr auto;gap:4px 10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.list .m{font-family:var(--f-kyo);font-weight:600;font-size:1.5rem;color:var(--pen);text-align:center;line-height:1}
.list .m.ng{color:var(--sub)}
.sent{font-family:var(--f-kyo);font-weight:600;font-size:1.15rem;line-height:2.1}
.sent .tg{border-bottom:2px solid var(--pen)}
.sent rt{color:var(--pen);font-size:.6em}
.list .sub{grid-column:2 / 4;color:var(--sub);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.list .sec{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline;font-size:.85rem}

/* きろく */
.sum{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.sum div{padding:12px 14px;border-left:1px solid var(--line)}
.sum div:first-child{border-left:0}
.sum b{display:block;font-size:1.5rem;line-height:1.3;font-variant-numeric:tabular-nums}
.sum span{color:var(--sub);font-size:.85rem}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,1fr)}.sum div:nth-child(3){border-left:0}.sum div:nth-child(n+3){border-top:1px solid var(--line)}}
.scroll{overflow-x:auto}
table.gt{border-collapse:collapse;width:100%;table-layout:fixed;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.gt th,.gt td{border:1px solid var(--line);padding:8px 4px;text-align:center}
.gt tr th:first-child{width:4.2em}
.gt th{font-weight:700;background:var(--soft)}
.gt td b{display:block;font-size:1.2rem;line-height:1.3}
.gt td span{display:block;color:var(--sub);font-size:.8rem;line-height:1.4}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--sub);margin:6px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
details.hist{border-bottom:1px solid var(--line)}
details.hist summary::before{content:'＋';color:var(--sub)}
details.hist[open] summary::before{content:'－'}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary{list-style:none;display:flex;gap:12px;flex-wrap:wrap;padding:10px 2px;cursor:pointer;font-variant-numeric:tabular-nums}
details.hist summary .pt{font-family:var(--f-kyo);font-weight:600;color:var(--pen);font-size:1.3rem;line-height:1.3;min-width:3.4em}
details.hist summary .dt{color:var(--sub)}
.cmp{margin:12px 0 0;font-weight:700}
.cmp .up{color:var(--pen)}
.best{margin:0 0 8px;color:var(--sub)}
.best b{color:var(--ink)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--sub)}
.flash{background:var(--soft);border-radius:8px;padding:10px 14px;margin:0 0 14px}
</style>
</head>
<body>
<header class="board">
  <div class="board-in">
    <h1>漢字よみテスト</h1>
    <span class="range">小学1〜4年</span>
    <nav class="nav" id="nav" aria-label="画面の切りかえ">
      <button type="button" data-go="home" aria-current="page">テスト</button>
      <button type="button" data-go="records">きろく</button>
    </nav>
  </div>
</header>

<main>
  <section id="v-home">
    <h2>テストの じゅんび</h2>
    <p class="flash" id="flash" hidden></p>
    <div class="row"><div class="lab">だれが やる？</div><div>
      <div class="chips" id="c-player"></div>
      <div class="addbox" id="addbox" hidden>
        <input type="text" id="in-name" maxlength="12" placeholder="なまえ（ニックネーム）" aria-label="なまえ">
        <button type="button" class="btn" id="b-addname">この名前で追加</button>
      </div>
    </div></div>
    <div class="row"><div class="lab">学年</div><div class="chips" id="c-grades"></div></div>
    <div class="row"><div class="lab">読み方</div><div class="chips" id="c-types"></div>
      <p class="note">熟語には、特別な読み方（今日・大人など）や都道府県名も入っています。</p></div>
    <div class="row"><div class="lab">問題の数</div><div class="chips" id="c-n"></div></div>
    <div class="row"><div class="lab">答え方</div><div class="chips" id="c-mode"></div>
      <p class="note" id="mode-note"></p></div>
    <div class="row"><div class="lab">進み方</div><div>
      <div class="chips" id="c-flow"></div>
      <div class="chips" id="c-fsec" style="margin-top:8px"></div></div>
      <p class="note" id="flow-note"></p></div>
    <details class="more">
      <summary>くわしい設定</summary>
      <div class="row"><div class="lab">出し方</div><div class="chips" id="c-how"></div>
        <p class="note">「おまかせ」は、まだ出ていない問題と まちがえた問題を多めに出します。</p></div>
      <div class="row" id="row-limit"><div class="lab">制限時間</div><div class="chips" id="c-limit"></div>
        <p class="note">1問ごとの時間です。すぎると不正解になります。</p></div>
      <div class="row" id="row-retry"><div class="lab">言い直し</div><div class="chips" id="c-retry"></div>
        <p class="note">声で答えるとき、ちがう言葉が聞こえたあとに言い直せる回数です。</p></div>
    </details>
    <p class="pool" id="pool"></p>
    <button type="button" class="btn primary big" id="b-start">テストを はじめる</button>
  </section>

  <section id="v-test" hidden>
    <div class="tbar"><span id="t-count"></span><div class="prog" aria-hidden="true"><i id="t-prog"></i></div><span id="t-clock"></span></div>
    <div class="sheet" id="sheet">
      <div class="tags" id="t-tags"></div>
      <p class="q-sent" id="t-sent" lang="ja"></p>
      <svg class="mark" id="t-mark" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <div class="cd" id="t-cd" hidden><i></i></div>
      <p class="paused" id="t-paused" hidden>おやすみ中</p>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
    <div class="tfoot"><button type="button" class="btn" id="b-pause" hidden>いったん とめる</button> <button type="button" class="btn ghost" id="b-quit">テストを やめる</button></div>
  </section>

  <section id="v-result" hidden></section>
  <section id="v-records" hidden></section>
</main>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function btn(txt,cls,fn){var b=el('button','btn'+(cls?' '+cls:''),txt);b.type='button';b.addEventListener('click',fn);return b;}
var TYPE={o:'音読み',k:'訓読み',j:'熟語'};
var MODE={voice:'声',key:'キーボード',self:'自分で丸つけ'};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;

/* ================= 問題バンク ================= */
function norm(s){
  s=String(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});
  return s.replace(/[\s\u3000、。,.!?「」『』()・…~〜\-]/g,'');
}
var HOMO={};
$('#homo').textContent.trim().split(/\n+/).forEach(function(line){
  var i=line.indexOf(':');if(i<0)return;
  HOMO[line.slice(0,i).trim()]=line.slice(i+1).split(',').map(norm).filter(Boolean);
});
var BANK=[],BYID={};
$('#bank').textContent.trim().split(/\n+/).forEach(function(line){
  var p=line.trim().split('|');if(p.length!==3)return;
  var m=p[1].match(/^(.*)\[(.+)\](.*)$/);if(!m)return;
  var alts=p[2].split('/');
  var yomi=alts.filter(function(a){return /^[ぁ-んー]+$/.test(a);});
  var accept=[];alts.concat([m[2]]).map(norm).forEach(function(a){if(a&&accept.indexOf(a)<0)accept.push(a);});
  var homo=[];
  yomi.forEach(function(r){(HOMO[r]||[]).forEach(function(h){if(accept.indexOf(h)<0&&homo.indexOf(h)<0)homo.push(h);});});
  var q={id:p[0]+':'+m[2]+':'+alts[0],g:+p[0].charAt(0),t:p[0].charAt(1),pre:m[1],tg:m[2],post:m[3],yomi:yomi,accept:accept,homo:homo};
  BANK.push(q);BYID[q.id]=q;
});
function matches(q,text){
  var t=norm(text);if(!t)return false;
  for(var i=0;i<q.accept.length;i++){if(t.indexOf(q.accept[i])>=0)return true;}
  for(var j=0;j<q.homo.length;j++){var h=q.homo[j];if(h.length>=2?t.indexOf(h)>=0:t===h)return true;}
  return false;
}
var FILLER=['えー','えーと','えっと','えーっと','えと','あのー','あの','うーん','うん','んー','あー','えーとね','えっとね','ん'];
function isFiller(text){var t=norm(text);return !t||FILLER.indexOf(t)>=0;}
function sentNodes(q,open,ruby){
  var f=document.createDocumentFragment();
  f.appendChild(document.createTextNode(q.pre));
  var tg;
  if(open){tg=el('ruby','tg');tg.appendChild(document.createTextNode(q.tg));tg.appendChild(el('rt',null,q.yomi[0]));}
  else{tg=el('span','tg',q.tg);}
  f.appendChild(tg);
  f.appendChild(document.createTextNode(q.post));
  return f;
}
function sec(ms){return (ms/1000).toFixed(1)+'秒';}
function pct(ok,n){return n?Math.round(ok/n*100):0;}

/* ================= 設定（この端末だけに保存） ================= */
var S={grades:[1,2,3,4],types:['o','k','j'],n:10,how:'auto',mode:SR?'voice':'self',limit:20,retry:1,flash:true,fsec:5,player:null};
try{var sv=JSON.parse(localStorage.getItem('kanjiYomi.settings')||'null');if(sv&&typeof sv==='object'){Object.keys(S).forEach(function(k){if(sv[k]!=null)S[k]=sv[k];});}}catch(e){}
if(S.mode==='voice'&&!SR)S.mode='self';
function saveSettings(){try{localStorage.setItem('kanjiYomi.settings',JSON.stringify(S));}catch(e){}}

/* ================= きろくの保存 ================= */
var Store={backend:'local',players:[],col:null,dl:null,warn:''};
function newPlayer(name,auto){return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,created:Date.now(),auto:!!auto,q:{},s:[]};}
function serial(p){
  var o={kind:'player',name:p.name,created:p.created,q:p.q,s:p.s};
  var json=JSON.stringify(o);
  while(new Blob([json]).size>200*1024&&o.s.length>5){o.s=o.s.slice(Math.ceil(o.s.length/10));json=JSON.stringify(o);}
  p.s=o.s;
  return JSON.parse(json);
}
function revive(id,x){return {id:id,name:String(x.name||'ななし'),created:x.created||0,auto:false,q:(x.q&&typeof x.q==='object')?x.q:{},s:Array.isArray(x.s)?x.s:[]};}
function writeLocal(){
  try{var o={};Store.players.forEach(function(p){if(!p.auto||p.s.length)o[p.id]=serial(p);});localStorage.setItem('kanjiYomi.records',JSON.stringify(o));}catch(e){}
}
function readLocal(){
  try{var o=JSON.parse(localStorage.getItem('kanjiYomi.records')||'null');if(!o)return [];
    return Object.keys(o).map(function(id){return revive(id,o[id]);});}catch(e){return [];}
}
var saving={};
function persist(p){
  if(Store.backend!=='db'){writeLocal();return;}
  var st=saving[p.id]||(saving[p.id]={busy:false,dirty:false});
  if(st.busy){st.dirty=true;return;}
  st.busy=true;
  (function run(){
    st.dirty=false;
    Store.col.doc(p.id).set(serial(p)).then(function(){
      if(st.dirty)run();else st.busy=false;
    },function(){
      st.busy=false;Store.backend='local';
      Store.warn='アカウントへの保存ができなかったため、きろくは この端末のブラウザに保存しています。';
      writeLocal();
    });
  })();
}
function removePlayer(p){
  Store.players=Store.players.filter(function(x){return x!==p;});
  if(Store.backend==='db'){Store.col.doc(p.id).delete().catch(function(){});}else writeLocal();
  if(!Store.players.length)Store.players=[newPlayer('じぶん',true)];
}
function P(){
  var p=null;Store.players.forEach(function(x){if(x.id===S.player)p=x;});
  if(!p){p=Store.players[0];S.player=p.id;}
  return p;
}
function addSession(p,sess){
  if(Store.players.indexOf(p)<0)Store.players.push(p);
  p.auto=false;p.s.push(sess);
  sess.it.forEach(function(it){
    var a=p.q[it[0]]||(p.q[it[0]]=[0,0,0,0,0]);
    a[0]++;if(it[1]){a[1]++;a[2]+=it[2];}a[3]=sess.t;a[4]=it[1];
  });
  persist(p);
}
function flipItem(p,sess,i){
  var it=sess.it[i],a=p.q[it[0]];
  it[1]=it[1]?0:1;
  if(a){a[1]+=it[1]?1:-1;a[2]+=it[1]?it[2]:-it[2];if(a[1]<0)a[1]=0;if(a[2]<0)a[2]=0;if(a[3]===sess.t)a[4]=it[1];}
  persist(p);
}
function initStore(){
  Store.players=readLocal();
  if(!Store.players.length)Store.players=[newPlayer('じぶん',true)];
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return null;
      var col=db.collection('data/users/'+uid);
      return col.get().then(function(snap){
        var cloud=[];
        snap.docs.forEach(function(d){var x=d.data();if(x&&x.kind==='player')cloud.push(revive(d.id,JSON.parse(JSON.stringify(x))));});
        function last(p){return p.s.length?p.s[p.s.length-1].t:0;}
        var byId={};cloud.forEach(function(p){byId[p.id]=p;});
        var push=[];
        Store.players.forEach(function(p){
          if(p.auto&&!p.s.length)return;
          var c=byId[p.id];
          if(!c||last(p)>last(c)){byId[p.id]=p;push.push(p);}
        });
        Store.col=col;Store.backend='db';
        Store.players=Object.keys(byId).map(function(id){return byId[id];}).sort(function(a,b){return a.created-b.created;});
        if(!Store.players.length)Store.players=[newPlayer('じぶん',true)];
        push.forEach(persist);
        P();
        if(view==='home')renderHome();
        if(view==='records')renderRecords();
      });
    });
  }).catch(function(){});
  window.claude.use('downloads').then(function(d){if(d){Store.dl=d;if(view==='records')renderRecords();}}).catch(function(){});
}

/* ================= 画面の切りかえ ================= */
var view='home';
function show(v){
  view=v;
  ['home','test','result','records'].forEach(function(k){$('#v-'+k).hidden=(k!==v);});
  $('#nav').hidden=(v==='test');
  $$('#nav button').forEach(function(b){
    var on=(b.dataset.go==='records')===(v==='records');
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
}
$$('#nav button').forEach(function(b){b.addEventListener('click',function(){
  if(b.dataset.go==='records'){renderRecords();show('records');}else{renderHome();show('home');}
});});

/* ================= ホーム ================= */
function chipGroup(host,items,get,set,multi){
  host.textContent='';
  items.forEach(function(it){
    var b=el('button','chip',it.label);b.type='button';b.disabled=!!it.disabled;
    var on=multi?get().indexOf(it.v)>=0:get()===it.v;
    b.setAttribute('aria-pressed',on?'true':'false');
    b.addEventListener('click',function(){
      if(multi){var a=get().slice(),i=a.indexOf(it.v);if(i>=0){if(a.length>1)a.splice(i,1);}else a.push(it.v);set(a);}
      else set(it.v);
      saveSettings();renderHome();
    });
    host.appendChild(b);
  });
}
function renderPlayers(){
  var host=$('#c-player');host.textContent='';
  var cur=P();
  Store.players.forEach(function(p){
    var b=el('button','chip',p.name);b.type='button';
    b.setAttribute('aria-pressed',p===cur?'true':'false');
    b.addEventListener('click',function(){S.player=p.id;saveSettings();renderHome();});
    host.appendChild(b);
  });
  var add=el('button','chip add','＋ 人を追加');add.type='button';
  add.addEventListener('click',function(){$('#addbox').hidden=false;$('#in-name').focus();});
  host.appendChild(add);
}
function addName(){
  var name=$('#in-name').value.trim();if(!name)return;
  var only=Store.players.length===1&&Store.players[0].auto&&!Store.players[0].s.length?Store.players[0]:null;
  var p;
  if(only){only.name=name;only.auto=false;p=only;}else{p=newPlayer(name,false);Store.players.push(p);}
  S.player=p.id;saveSettings();persist(p);
  $('#in-name').value='';$('#addbox').hidden=true;renderHome();
}
$('#b-addname').addEventListener('click',addName);
$('#in-name').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)addName();});
function pool(){return BANK.filter(function(q){return S.grades.indexOf(q.g)>=0&&S.types.indexOf(q.t)>=0;});}
function isWeak(a){return a&&a[0]>0&&(!a[4]||a[1]/a[0]<0.8);}
function renderHome(){
  renderPlayers();
  chipGroup($('#c-grades'),[1,2,3,4].map(function(g){return {v:g,label:g+'年生'};}),function(){return S.grades;},function(v){S.grades=v;},true);
  chipGroup($('#c-types'),['o','k','j'].map(function(t){return {v:t,label:TYPE[t]};}),function(){return S.types;},function(v){S.types=v;},true);
  chipGroup($('#c-n'),[10,20,30,50,100].map(function(n){return {v:n,label:n+'問'};}),function(){return S.n;},function(v){S.n=v;});
  chipGroup($('#c-mode'),[{v:'voice',label:'声で答える',disabled:!SR},{v:'key',label:'キーボードで打つ'},{v:'self',label:'自分で丸つけ'}],function(){return S.mode;},function(v){S.mode=v;});
  chipGroup($('#c-how'),[{v:'auto',label:'おまかせ'},{v:'random',label:'ランダム'},{v:'weak',label:'にがてだけ'}],function(){return S.how;},function(v){S.how=v;});
  chipGroup($('#c-limit'),[{v:10,label:'10秒'},{v:20,label:'20秒'},{v:30,label:'30秒'},{v:0,label:'なし'}],function(){return S.limit;},function(v){S.limit=v;});
  chipGroup($('#c-retry'),[{v:0,label:'なし'},{v:1,label:'1回まで'},{v:-1,label:'何回でも'}],function(){return S.retry;},function(v){S.retry=v;});
  chipGroup($('#c-flow'),[{v:true,label:'自動で進む（フラッシュカード）'},{v:false,label:'ボタンで進む'}],function(){return S.flash;},function(v){S.flash=v;});
  chipGroup($('#c-fsec'),[3,5,7,10].map(function(n){return {v:n,label:n+'秒'};}),function(){return S.fsec;},function(v){S.fsec=v;});
  $('#c-fsec').hidden=!S.flash;
  $('#flow-note').textContent=S.flash?
    '1まいを'+S.fsec+'秒ずつ見せて、自動で次へ進みます。読めたらすぐ次へ、時間ぎれのときは答えを少し見せてから次へ進みます。'+(S.mode==='self'?'「自分で丸つけ」のときは、カードの下の ○・× をおしてください（おさないと時間ぎれ＝×になります）。':''):
    '1問ずつ「つぎへ」をおして進みます。';
  $('#row-limit').hidden=S.flash;
  $('#row-retry').hidden=(S.mode!=='voice'||S.flash);
  $('#mode-note').textContent=
    S.mode==='voice'?'マイクに向かって読みます。聞きまちがいは、あとから○×を直せます。':
    S.mode==='key'?'読みがなを ひらがなで打ちます。':
    '声に出して読んでから答えを見て、合っていたかを自分（おうちの人）がえらびます。';
  if(!SR)$('#mode-note').textContent+=' このブラウザは音声認識に対応していないため、「声で答える」は使えません（Chrome・Edge・Safariで使えます）。';
  var pl=pool(),p=P(),n=pl.length;
  if(S.how==='weak'){n=pl.filter(function(q){return isWeak(p.q[q.id]);}).length;}
  $('#pool').textContent=(S.how==='weak'?'にがてな問題：':'えらんだ はんいの問題：')+n+'問';
  $('#b-start').disabled=(n===0);
  var fl=$('#flash');fl.hidden=!Store.warn;fl.textContent=Store.warn;
}
function pick(){
  var p=P(),pl=pool();
  if(S.how==='weak')pl=pl.filter(function(q){return isWeak(p.q[q.id]);});
  function w(q){
    if(S.how!=='auto')return 1;
    var a=p.q[q.id];if(!a||!a[0])return 3;if(!a[4])return 5;if(a[1]/a[0]<0.8)return 3;return 1;
  }
  return pl.map(function(q){return {q:q,k:Math.pow(Math.random(),1/w(q))};})
    .sort(function(a,b){return b.k-a.k;}).slice(0,S.n).map(function(x){return x.q;})
    .sort(function(){return Math.random()-0.5;});
}
$('#b-start').addEventListener('click',function(){var qs=pick();if(qs.length)startTest(qs,S.how==='weak'?'weak':'');});

/* ================= テスト ================= */
var T={};
function clearTimers(){clearInterval(T.tick);clearTimeout(T.revealTimer);clearTimeout(T.autoNext);}
function startTest(qs,kind){
  T={qs:qs,i:0,res:[],mode:S.mode,flash:!!S.flash,limit:S.flash?S.fsec:S.limit,retry:S.flash?-1:S.retry,first:true,player:P(),state:'idle',
     kind:kind||'',range:{g:S.grades.slice(),t:S.types.slice()}};
  show('test');
  $('#b-pause').hidden=!T.flash;setPaused(false);
  $('#t-cd').hidden=!T.flash;
  beginVoiceOr(nextQuestion);
}
/* 声で答えるときは、テストの最初に1回だけマイクを開き、テスト中はずっと開いたままにする */
function beginVoiceOr(next){
  if(T.mode!=='voice')return next();
  T.state='prep';
  $('#t-count').textContent='';$('#t-clock').textContent='';$('#t-sent').textContent='';$('#t-mark').textContent='';$('#t-tags').textContent='';
  $('#sheet').classList.add('is-prep');
  panelPrep();
  Mic.open().then(function(ok){
    if(T.state!=='prep'||T.mode!=='voice')return;
    if(ok===false)return micTrouble('not-allowed');
    next();
  });
}
function nextQuestion(){
  clearTimers();
  if(T.mode!=='voice'){Rec.stop();Mic.close();}
  if(T.i>=T.qs.length)return endTest();
  var q=T.q=T.qs[T.i];
  T.state='prep';T.tries=0;T.heard='';
  $('#t-count').textContent=(T.i+1)+' / '+T.qs.length;
  $('#t-prog').style.width=(T.i/T.qs.length*100)+'%';
  $('#t-clock').textContent='';
  var tags=$('#t-tags');tags.textContent='';tags.appendChild(el('span',null,q.g+'年'));tags.appendChild(el('span',null,TYPE[q.t]));
  var s=$('#t-sent');s.textContent='';s.classList.remove('open');s.appendChild(sentNodes(q,false));
  $('#t-mark').textContent='';
  $('#sheet').classList.add('is-prep');
  if(T.mode==='voice'){
    if(Rec.live)return reveal();
    panelPrep();Rec.start();
    T.revealTimer=setTimeout(function(){if(T.state==='prep')micTrouble('slow');},T.first?20000:10000);
  }else reveal();
}
function reveal(){
  if(T.state!=='prep')return;
  clearTimeout(T.revealTimer);T.first=false;
  T.state='ask';T.t0=performance.now();
  Rec.mark();
  $('#sheet').classList.remove('is-prep');
  panelAsk();
  T.tick=setInterval(tick,100);tick();
}
function tick(){
  var s=(performance.now()-T.t0)/1000;
  $('#t-clock').textContent=s.toFixed(1)+'びょう';
  if(T.flash){
    var left=Math.max(0,T.limit-s),cd=$('#t-cd');
    cd.firstChild.style.width=(left/T.limit*100)+'%';
    cd.classList.toggle('low',left<=1.5);
  }
  if(T.limit&&s>=T.limit){
    if(T.state==='ask')finish(false,T.limit*1000,'timeout');
  }
}
function openAnswer(){var s=$('#t-sent');s.textContent='';s.classList.add('open');s.appendChild(sentNodes(T.q,true));}
function showMark(ok){
  var m=$('#t-mark');
  m.innerHTML=ok?'<path d="M108 22C60 14 18 52 20 102C22 152 62 184 106 180C152 176 184 138 180 96C176 52 140 20 92 26"/>'
               :'<path d="M48 44L150 158"/><path d="M154 46L50 156"/>';
}
function finish(ok,ms,why){
  if(T.state!=='ask')return;
  T.state='done';clearTimers();
  var r={id:T.q.id,ok:ok?1:0,ms:Math.round(ms),heard:T.heard,why:ok?'':(why||'')};
  T.res.push(r);
  $('#t-clock').textContent=(ms/1000).toFixed(1)+'びょう';
  openAnswer();showMark(ok);
  panelDone(r);
  if(T.flash){$('#t-cd').firstChild.style.width='0%';T.autoNext=setTimeout(advance,ok?1000:1800);}
  else if(ok)T.autoNext=setTimeout(advance,1500);
}
function advance(){clearTimeout(T.autoNext);setPaused(false);T.i++;nextQuestion();}
/* 一時停止（フラッシュカード） */
function setPaused(on){
  $('#b-pause').textContent=on?'つづける':'いったん とめる';
  $('#b-pause').classList.toggle('primary',!!on);
  $('#t-paused').hidden=!(on&&T.state==='paused');
}
$('#b-pause').addEventListener('click',function(){
  if(T.state==='ask'){
    T.pausedAt=performance.now();clearInterval(T.tick);T.state='paused';
    $('#sheet').classList.add('is-prep');setPaused(true);
  }else if(T.state==='paused'){
    T.t0+=performance.now()-T.pausedAt;T.state='ask';Rec.mark();
    $('#sheet').classList.remove('is-prep');setPaused(false);
    T.tick=setInterval(tick,100);tick();
  }else if(T.state==='done'){
    clearTimeout(T.autoNext);T.state='donePaused';setPaused(true);
  }else if(T.state==='donePaused'){
    T.state='done';advance();
  }
});
function endTest(){
  clearTimers();Rec.stop();Mic.close();T.state='idle';setPaused(false);
  if(!T.res.length){renderHome();show('home');return;}
  T.sess={t:Date.now(),m:T.mode,k:T.kind,r:T.range,f:T.flash?T.limit:0,it:T.res.map(function(r){return [r.id,r.ok,r.ms];})};
  addSession(T.player,T.sess);
  renderResult();show('result');
}
$('#b-quit').addEventListener('click',endTest);

/* ---- マイク（テスト中は開いたままにして、許可のたずね直しをへらす） ---- */
var Mic={stream:null,
  open:function(){
    if(Mic.stream)return Promise.resolve(true);
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.resolve(null);
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      if(view!=='test'||T.mode!=='voice'){s.getTracks().forEach(function(t){t.stop();});return null;}
      Mic.stream=s;return true;
    },function(e){
      return (e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?false:null;
    });
  },
  close:function(){if(Mic.stream){Mic.stream.getTracks().forEach(function(t){t.stop();});Mic.stream=null;}}
};

/* ---- 音声認識（テスト中は1つの認識をつづけて使う） ---- */
var Rec={r:null,want:false,live:false,base:0,seen:0,open:null,prefix:'',quick:0,startedAt:0,timer:0,
  start:function(){
    Rec.want=true;
    if(Rec.r)return;
    var r;try{r=new SR();}catch(e){return micTrouble('unsupported');}
    r.lang='ja-JP';r.interimResults=true;r.maxAlternatives=5;r.continuous=true;
    Rec.seen=0;Rec.base=0;Rec.open=null;Rec.prefix='';Rec.startedAt=Date.now();
    r.onstart=function(){if(Rec.r!==r)return;Rec.live=true;Rec.startedAt=Date.now();setMic(true);if(T.state==='prep')reveal();};
    r.onresult=function(e){if(Rec.r!==r)return;onSpeech(e);};
    r.onerror=function(e){
      if(Rec.r!==r)return;var c=e.error;
      if(c==='not-allowed'||c==='service-not-allowed'||c==='audio-capture'||c==='language-not-supported'||c==='network'){Rec.want=false;micTrouble(c);}
    };
    r.onend=function(){
      if(Rec.r!==r)return;
      Rec.r=null;Rec.live=false;setMic(false);
      if(!Rec.want)return;
      if(Date.now()-Rec.startedAt<1000){if(++Rec.quick>=6){Rec.want=false;return micTrouble('unstable');}}else Rec.quick=0;
      clearTimeout(Rec.timer);Rec.timer=setTimeout(function(){if(Rec.want)Rec.start();},300);
    };
    Rec.r=r;
    try{r.start();}catch(e){Rec.r=null;clearTimeout(Rec.timer);Rec.timer=setTimeout(function(){if(Rec.want)Rec.start();},600);}
  },
  stop:function(){
    Rec.want=false;clearTimeout(Rec.timer);
    var r=Rec.r;Rec.r=null;Rec.live=false;
    if(r){r.onresult=r.onerror=r.onend=r.onstart=null;try{r.abort();}catch(e){}}
    setMic(false);
  },
  /* 新しい問題が出たら、それまでに聞こえた言葉は使わない（話しつづけている途中の分も切りはなす） */
  mark:function(){
    if(Rec.open){Rec.base=Rec.open.i;Rec.prefix=Rec.open.t;}
    else{Rec.base=Rec.seen;Rec.prefix='';}
  }
};
function onSpeech(e){
  var n=e.results.length,last=n?e.results[n-1]:null;
  Rec.seen=n;
  Rec.open=(last&&!last.isFinal)?{i:n-1,t:last[0].transcript}:null;
  if(T.state!=='ask'||T.mode!=='voice')return;
  var top='',hit=false,lastFinal=-1,allFinal=true;
  function cut(i,tx){
    if(i===Rec.base&&Rec.prefix&&tx.indexOf(Rec.prefix)===0)return tx.slice(Rec.prefix.length);
    return tx;
  }
  for(var i=Rec.base;i<n;i++){
    var res=e.results[i];
    top+=cut(i,res[0].transcript);
    for(var k=0;k<res.length;k++){if(matches(T.q,cut(i,res[k].transcript)))hit=true;}
    if(res.isFinal)lastFinal=i;else allFinal=false;
  }
  if(!top.trim())return;
  if(matches(T.q,top))hit=true;
  T.heard=top.trim();showHeard(T.heard);
  if(hit)return finish(true,performance.now()-T.t0,'');
  if(allFinal&&lastFinal>=0&&!isFiller(top)){
    Rec.base=lastFinal+1;Rec.prefix='';
    T.tries++;
    if(T.retry>=0&&T.tries>T.retry)finish(false,performance.now()-T.t0,'wrong');
    else setSay('もういちど いってみよう','ゆっくり はっきり よんでね');
  }
}
function switchMode(m){Rec.stop();Mic.close();T.mode=m;T.first=true;beginVoiceOr(nextQuestion);}
function micTrouble(code){
  Rec.stop();Mic.close();clearTimers();T.state='mic';
  $('#sheet').classList.add('is-prep');
  var p=$('#panel');p.textContent='';
  var msg=code==='network'?'音声認識のサービスに つながりませんでした。':
          (code==='audio-capture')?'マイクが見つかりませんでした。':
          (code==='slow'||code==='unstable')?'マイクの準備が うまくいきませんでした。':
          'マイクを使う許可が ありませんでした。';
  p.appendChild(el('p','say',msg));
  p.appendChild(el('p','note','ブラウザでこのページのマイクを「許可」にしてから、もう一度ためしてください。この画面の中でマイクが使えないときは、ページをChromeで直接開くと使える場合があります。ほかの答え方で、このまま続けることもできます。'));
  var b=el('div','btns');
  b.appendChild(btn('もう一度 マイクをためす','primary',function(){switchMode('voice');}));
  b.appendChild(btn('自分で丸つけに切りかえる','',function(){switchMode('self');}));
  b.appendChild(btn('キーボードに切りかえる','',function(){switchMode('key');}));
  p.appendChild(b);
}

/* ================= 結果 ================= */
function summarize(items){
  var n=items.length,ok=0,ms=0,all=0;
  items.forEach(function(it){all+=it[2];if(it[1]){ok++;ms+=it[2];}});
  return {n:n,ok:ok,avg:ok?ms/ok:null,all:all};
}
function scoreOf(s){var m=summarize(s.it);return pct(m.ok,m.n);}
function rangeLabel(s){
  if(s.k==='retry')return 'まちがえた問題';
  if(s.k==='weak')return 'にがてな問題';
  if(!s.r)return '';
  var g=s.r.g.slice().sort(),t=s.r.t;
  var gl=g.length===4?'1〜4年':g.join('・')+'年';
  var tl=t.length===3?'音訓熟':['o','k','j'].filter(function(x){return t.indexOf(x)>=0;}).map(function(x){return TYPE[x].charAt(0);}).join('・');
  return gl+'・'+tl;
}
var framed=true;try{framed=window.self!==window.top;}catch(e){}
function canDownload(){return !!Store.dl||!framed;}
function download(name,text){
  if(Store.dl){Store.dl.save({filename:name,data:text}).catch(function(){});return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function itemRow(it,onFlip){

  li.appendChild(el('span','m'+(it[1]?'':' ng'),it[1]?'○':'×'));
  var s=el('span','sent');

    var b=el('button','link',it[1]?'×に直す':'○に直す');b.type='button';
    b.addEventListener('click',onFlip);sub.appendChild(b);
  }
  li.appendChild(sub);
  return li;
}
function renderResult(){
  var host=$('#v-result');host.textContent='';
  var sm=summarize(T.sess.it);
  host.appendChild(el('h2',null,T.player.name+' さんの けっか'));
  var head=el('div','paperhead');
  var sc=el('div','score',String(pct(sm.ok,sm.n)));sc.appendChild(el('small',null,'点'));head.appendChild(sc);
  var dl=el('dl','facts');
  [['正解',sm.ok+' / '+sm.n+'問'],['正解率',pct(sm.ok,sm.n)+'%'],['平均回答時間',sm.avg==null?'—':sec(sm.avg)+'（正解した問題）'],['合計時間',sec(sm.all)]].forEach(function(r){
    dl.appendChild(el('dt',null,r[0]));dl.appendChild(el('dd',null,r[1]));
  });
  head.appendChild(dl);host.appendChild(head);

    var cmp=el('p','cmp','ぜんかい '+prev+'点 → こんかい '+now+'点');

    host.appendChild(cmp);
    host.appendChild(el('p','note',now>best?'これまでで いちばん高い点数です！':'これまでの最高は '+best+'点です。'));
  }
  host.appendChild(el('p','note','この結果は「きろく」に保存しました。判定がちがっていたら、下の「○に直す／×に直す」で直せます。'));
  host.appendChild(el('h3',null,'1問ずつの結果'));

    ul.appendChild(itemRow(it,function(){flipItem(T.player,T.sess,i);renderResult();}));
  });

  var wrong=T.sess.it.filter(function(it){return !it[1]&&BYID[it[0]];}).map(function(it){return BYID[it[0]];});
  if(wrong.length)b.appendChild(btn('まちがえた問題を もう一度','primary',function(){startTest(wrong.slice(),'retry');}));
  b.appendChild(btn('べつの問題で もう一度',wrong.length?'':'primary',function(){var qs=pick();if(qs.length)startTest(qs);else{renderHome();show('home');}}));
  b.appendChild(btn('きろくを見る','',function(){renderRecords();show('records');}));
  b.appendChild(btn('じゅんびにもどる','',function(){renderHome();show('home');}));
  host.appendChild(b);

/* ================= きろく ================= */
function fmtDate(t){var d=new Date(t);function z(n){return (n<10?'0':'')+n;}return (d.getMonth()+1)+'/'+d.getDate()+' '+z(d.getHours())+':'+z(d.getMinutes());}
function chartSVG(list){
  var W=600,H=190,L=34,R=40,Tp=12,B=24,n=list.length,iw=(W-L-R)/n,bw=Math.min(26,iw*0.6);
  var maxS=1;list.forEach(function(s){if(s.avg!=null)maxS=Math.max(maxS,s.avg/1000);});maxS=Math.ceil(maxS);
  var h=H-Tp-B,svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近のテストの正解率と平均回答時間">';
  [0,50,100].forEach(function(v){var y=Tp+h-(v/100)*h;
    svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--sub)">'+v+'%</text>';});
  svg+='<text x="'+(W-R+6)+'" y="'+(Tp+4)+'" font-size="11" fill="var(--pen)">'+maxS+'秒</text><text x="'+(W-R+6)+'" y="'+(Tp+h+4)+'" font-size="11" fill="var(--pen)">0秒</text>';
  var pts=[];
  list.forEach(function(s,i){
    var cx=L+iw*(i+0.5),bh=(pct(s.ok,s.n)/100)*h;
    svg+='<rect x="'+(cx-bw/2)+'" y="'+(Tp+h-bh)+'" width="'+bw+'" height="'+Math.max(bh,1)+'" rx="3" fill="var(--board)"/>';
    if(s.avg!=null)pts.push([cx,Tp+h-(s.avg/1000/maxS)*h]);
    if(n<=12||i===0||i===n-1)svg+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--sub)">'+s.label+'</text>';
  });
  if(pts.length>1)svg+='<polyline fill="none" stroke="var(--pen)" stroke-width="2.5" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p){svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--paper)" stroke="var(--pen)" stroke-width="2.5"/>';});
  return svg+'</svg>';
}
function csvOf(p){
  function c(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  var rows=[['日時','名前','テストの点数','はんい','答え方','学年','読み方','文','ことば','読みがな','正解','回答時間(秒)']];
  p.s.forEach(function(s){
    var d=new Date(s.t),ds=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
    s.it.forEach(function(it){var q=BYID[it[0]];
      rows.push([ds,p.name,scoreOf(s),rangeLabel(s),(MODE[s.m]||s.m)+(s.f?'・'+s.f+'秒カード':''),q?q.g:'',q?TYPE[q.t]:'',q?q.pre+q.tg+q.post:it[0],q?q.tg:'',q?q.yomi[0]:'',it[1]?1:0,(it[2]/1000).toFixed(1)]);});
  });
  return '\uFEFF'+rows.map(function(r){return r.map(c).join(',');}).join('\r\n');
}

function renderRecords(){
  var host=$('#v-records');host.textContent='';
  var p=P();
  host.appendChild(el('h2',null,'きろく'));
  if(Store.warn)host.appendChild(el('p','flash',Store.warn));
  var chips=el('div','chips');chips.style.marginBottom='16px';
  Store.players.forEach(function(x){
    var b=el('button','chip',x.name);b.type='button';b.setAttribute('aria-pressed',x===p?'true':'false');
    b.addEventListener('click',function(){S.player=x.id;saveSettings();delArmed=false;renderRecords();});chips.appendChild(b);
  });
  host.appendChild(chips);

  var n=0,ok=0,ms=0;
  Object.keys(p.q).forEach(function(id){var a=p.q[id];n+=a[0];ok+=a[1];ms+=a[2];});
  if(!n){
    host.appendChild(el('p','empty','まだ きろくが ありません。「テスト」で1回やってみると、ここに正解率と回答時間が出ます。'));
    return;
  }
  var sum=el('div','sum');
  [[n+'問','これまでに答えた数'],[pct(ok,n)+'%','正解率'],[ok?sec(ms/ok):'—','平均回答時間（正解）'],[p.s.length+'回','テストの回数']].forEach(function(r){
    var d=el('div');d.appendChild(el('b',null,r[0]));d.appendChild(el('span',null,r[1]));sum.appendChild(d);
  });
  host.appendChild(sum);

  /* 学年 × 読み方 */
  host.appendChild(el('h3',null,'学年・読み方ごとの成績'));
  var cell={};
  BANK.forEach(function(q){
    var k=q.g+q.t,c=cell[k]||(cell[k]={n:0,ok:0,ms:0,seen:0,total:0});c.total++;
    var a=p.q[q.id];if(a&&a[0]){c.n+=a[0];c.ok+=a[1];c.ms+=a[2];c.seen++;}
  });
  var tb=el('table','gt'),tr=el('tr');tr.appendChild(el('th',null,''));
  ['o','k','j'].forEach(function(t){tr.appendChild(el('th',null,TYPE[t]));});tb.appendChild(tr);
  [1,2,3,4].forEach(function(g){
    var r=el('tr');r.appendChild(el('th',null,g+'年生'));
    ['o','k','j'].forEach(function(t){
      var c=cell[g+t],td=el('td');
      if(c&&c.n){td.appendChild(el('b',null,pct(c.ok,c.n)+'%'));td.appendChild(el('span',null,c.ok?sec(c.ms/c.ok):'—'));td.appendChild(el('span',null,c.seen+'/'+c.total+'問'));}
      else{td.appendChild(el('b',null,'—'));td.appendChild(el('span',null,'0/'+(c?c.total:0)+'問'));}
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  var sc=el('div','scroll');sc.appendChild(tb);host.appendChild(sc);
  host.appendChild(el('p','note','大きい数字は正解率、その下は平均回答時間（正解した問題）と、出題ずみの問題数です。'));

  /* 推移 */
  var recent=p.s.slice(-20).map(function(s){var m=summarize(s.it);m.label=fmtDate(s.t).split(' ')[0];return m;});
  if(recent.length>1){
    host.appendChild(el('h3',null,'最近のテスト（'+recent.length+'回分）'));
    var ch=el('div','chart');ch.innerHTML=chartSVG(recent);
    var lg=el('div','legend');
    var l1=el('span');var i1=el('i');i1.style.background='var(--board)';l1.appendChild(i1);l1.appendChild(document.createTextNode('正解率'));
    var l2=el('span');var i2=el('i');i2.style.background='var(--pen)';i2.style.borderRadius='50%';l2.appendChild(i2);l2.appendChild(document.createTextNode('平均回答時間'));
    lg.appendChild(l1);lg.appendChild(l2);ch.appendChild(lg);host.appendChild(ch);
  }

  /* にがて */
  var weak=BANK.filter(function(q){return isWeak(p.q[q.id]);}).sort(function(a,b){
    var x=p.q[a.id],y=p.q[b.id];return (x[1]/x[0])-(y[1]/y[0])||y[0]-x[0];});
  host.appendChild(el('h3',null,'にがてな問題（'+weak.length+'問）'));
  if(!weak.length)host.appendChild(el('p','empty','いまは ありません。さいごに まちがえた問題や、正解率が80%より低い問題がここに出ます。'));
  else{
    var ul=el('ul','list');
    weak.slice(0,30).forEach(function(q){
      var a=p.q[q.id],li=el('li');
      li.appendChild(el('span','m ng','×'));
      var s=el('span','sent');s.appendChild(sentNodes(q,true));li.appendChild(s);
      li.appendChild(el('span','sec',a[1]+'/'+a[0]+'回'));
      var sub=el('div','sub');sub.appendChild(el('span',null,q.g+'年・'+TYPE[q.t]));
      if(a[1])sub.appendChild(el('span',null,'正解のときの平均 '+sec(a[2]/a[1])));
      li.appendChild(sub);ul.appendChild(li);
    });
    host.appendChild(ul);
    if(weak.length>30)host.appendChild(el('p','note','正解率の低い順に30問まで表示しています。'));
    var wb=el('div','btns');wb.style.marginTop='12px';
    wb.appendChild(btn('にがてな問題だけ テストする','primary',function(){
      var qs=weak.slice().sort(function(){return Math.random()-0.5;}).slice(0,S.n);startTest(qs,'weak');
    }));
    host.appendChild(wb);
  }

  /* 履歴 */
  host.appendChild(el('h3',null,'点数の記録（'+p.s.length+'回）'));
  var bestS=null;p.s.forEach(function(x){if(!bestS||scoreOf(x)>=scoreOf(bestS))bestS=x;});
  var bl=el('p','best','いちばん高い点数：');bl.appendChild(el('b',null,scoreOf(bestS)+'点'));
  bl.appendChild(document.createTextNode('（'+fmtDate(bestS.t)+'）'));host.appendChild(bl);
  var shown=p.s.slice(-50).reverse();
  shown.forEach(function(s){
    var m=summarize(s.it),d=el('details','hist'),sm=el('summary');
    sm.appendChild(el('span','pt',pct(m.ok,m.n)+'点'));
    sm.appendChild(el('span',null,m.ok+'/'+m.n+'問'));
    sm.appendChild(el('span',null,'平均 '+(m.avg==null?'—':sec(m.avg))));
    sm.appendChild(el('span','dt',fmtDate(s.t)));
    var rl=rangeLabel(s);if(rl)sm.appendChild(el('span','dt',rl));
    sm.appendChild(el('span','dt',(MODE[s.m]||'')+(s.f?'・'+s.f+'秒カード':'')));
    d.appendChild(sm);
    d.addEventListener('toggle',function(){
      if(!d.open||d.querySelector('ul'))return;
      var ul=el('ul','list');
      s.it.forEach(function(it,i){ul.appendChild(itemRow(it,function(){flipItem(p,s,i);renderRecords();}));});
      d.appendChild(ul);
    });
    host.appendChild(d);
  });
  host.appendChild(el('p','note','新しい順にならんでいます（50回分まで表示）。行をおすと1問ずつの結果が見られます。'));

  /* 書き出し・削除 */
  var tools=el('div','btns');tools.style.marginTop='24px';
  if(canDownload()){
    tools.appendChild(btn('CSVで書き出す','',function(){
      var d=new Date();
      download('kanji-yomi-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.csv',csvOf(p));
    }));
  }
  if(!delArmed){
    tools.appendChild(btn(p.name+' さんの きろくを消す','ghost',function(){delArmed=true;renderRecords();}));
  }else{
    tools.appendChild(btn('本当に消す（元にもどせません）','pen',function(){delArmed=false;removePlayer(p);S.player=null;P();saveSettings();renderRecords();}));
    tools.appendChild(btn('やめる','',function(){delArmed=false;renderRecords();}));
  }
  host.appendChild(tools);
  host.appendChild(el('p','note',Store.backend==='db'?'きろくは あなたのClaudeアカウントに保存され、ほかの人からは見えません。':'きろくは このパソコンのブラウザに保存されています。ブラウザの閲覧データを消すと きろくも消えるので、ときどき「CSVで書き出す」で保存しておくと安心です。'));
}

/* ================= 起動 ================= */
initStore();
renderHome();
})();
</script>
</body>
</html>
